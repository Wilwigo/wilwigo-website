<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>{{ page.title }} — Wilwigo</title>
  <style>
    :root { --blue:#087daf; --cyan:#16afe4; --ink:#18242d; --muted:#60707b; --line:#e6edf1; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:#fff; -webkit-font-smoothing:antialiased; }
    a { color:var(--blue); }
    .shell { width:min(860px,calc(100% - 40px)); margin:0 auto; }
    nav { min-height:88px; display:flex; align-items:center; justify-content:space-between; gap:24px; border-bottom:1px solid var(--line); }
    .brand img { width:165px; height:auto; display:block; }
    .home { text-decoration:none; font-size:14px; font-weight:700; color:var(--blue); }
    main { padding:56px 0 80px; }
    article { font-size:16px; line-height:1.7; }
    h1 { font-size:clamp(34px,5vw,48px); line-height:1.08; letter-spacing:-.035em; margin:0 0 24px; }
    h2 { font-size:24px; line-height:1.25; letter-spacing:-.02em; margin:44px 0 14px; }
    h3 { font-size:19px; margin:30px 0 10px; }
    p { margin:0 0 18px; }
    ul,ol { padding-left:24px; margin:0 0 20px; }
    li { margin:7px 0; }
    strong { font-weight:750; }
    hr { border:0; border-top:1px solid var(--line); margin:40px 0; }
    footer { border-top:1px solid var(--line); padding:26px 0 38px; color:var(--muted); font-size:13px; }
    @media (max-width:520px) { .shell{width:min(100% - 28px,860px)} nav{min-height:76px}.brand img{width:142px} main{padding:40px 0 64px} }
  </style>
</head>
<body>
  <div class="shell">
    <nav>
      <a class="brand" href="/" aria-label="Wilwigo home"><img src="/wilwigo-logo.webp" alt="Wilwigo" /></a>
      <a class="home" href="/">Back to Wilwigo</a>
    </nav>
    <main><article>{{ content }}</article></main>
    <footer>© 2026 Wilwigo Inc. · Early access</footer>
  </div>
</body>
</html>
